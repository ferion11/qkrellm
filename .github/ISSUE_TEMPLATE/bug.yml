name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: qkrellm version / commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Distro, kernel (uname -r), Qt version, X11 or Wayland
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Relevant kernel data
      description: For wrong readings, attach the /proc or /sys file involved (scrub personal data).
