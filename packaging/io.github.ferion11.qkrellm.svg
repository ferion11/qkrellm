<!-- qkrellm application icon: a framed stack of two rolling charts in the default theme colours. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="2" y="2" width="60" height="60" rx="8" fill="#2a2e33"/>
  <rect x="7" y="7" width="50" height="23" rx="2" fill="#101214"/>
  <rect x="7" y="34" width="50" height="23" rx="2" fill="#101214"/>
  <!-- top chart: system (orange) under user (blue) -->
  <g fill="#ff8a3d">
    <rect x="9" y="25" width="5" height="3"/><rect x="15" y="24" width="5" height="4"/>
    <rect x="21" y="22" width="5" height="6"/><rect x="27" y="23" width="5" height="5"/>
    <rect x="33" y="20" width="5" height="8"/><rect x="39" y="21" width="5" height="7"/>
    <rect x="45" y="18" width="5" height="10"/><rect x="51" y="19" width="4" height="9"/>
  </g>
  <g fill="#4fb3ff">
    <rect x="9" y="21" width="5" height="4"/><rect x="15" y="18" width="5" height="6"/>
    <rect x="21" y="16" width="5" height="6"/><rect x="27" y="18" width="5" height="5"/>
    <rect x="33" y="12" width="5" height="8"/><rect x="39" y="14" width="5" height="7"/>
    <rect x="45" y="10" width="5" height="8"/><rect x="51" y="12" width="4" height="7"/>
  </g>
  <!-- bottom chart: single series -->
  <g fill="#4fb3ff">
    <rect x="9" y="50" width="5" height="5"/><rect x="15" y="47" width="5" height="8"/>
    <rect x="21" y="48" width="5" height="7"/><rect x="27" y="44" width="5" height="11"/>
    <rect x="33" y="46" width="5" height="9"/><rect x="39" y="41" width="5" height="14"/>
    <rect x="45" y="43" width="5" height="12"/><rect x="51" y="39" width="4" height="16"/>
  </g>
</svg>
